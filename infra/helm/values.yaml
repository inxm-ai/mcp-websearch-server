appName: mcp-websearch-server
description: "Self-hosted web search, page extraction, crawl and research MCP server: SearXNG for search, stygian-browser for rendering"
replicaCount: 1

image:
  repository: inxm-ai/mcp-websearch-server
  tag: latest
  pullPolicy: IfNotPresent

service:
  enabled: true
  type: ClusterIP
  port: 8000

networking:
  mode: ingress
  gateway:
    hostname: ""
    parentRefs:
      - name: orchestrator-gateway
        sectionName: https

env:
  SERVICE_NAME: mcp-websearch-server
  HOSTNAME: "{{ hostname | default('') }}"
  MCP_BASE_PATH: "/api/mcp-websearch-server"

  AGENT_CARD_CACHE_FILE: /data/agent.json
  TGI_URL: http://app-tgi-core.orchestrator.svc.cluster.local:8000/v1
  DEFAULT_MODEL: "tgi"
  TOOL_INJECTION_MODE: claude
  OTLP_ENDPOINT: http://ops-otel-collector:4317
  MCP_SERVER_COMMAND: "/usr/local/bin/mcp-websearch"
  # web_research writes through the hub's approval flow, as it did on tavily.
  EFFECT_TOOLS: "*research*"
  # SEARXNG_URL and RENDER_* are set by the deployment from `searxng` and
  # `render` below.

# The metasearch backend `search` calls: upstream SearXNG, unmodified, as its
# own Deployment reached over its cluster Service only.
searxng:
  enabled: true
  # Used instead of the in-chart Service when set (e.g. with enabled: false).
  url: ""
  image:
    repository: searxng/searxng
    tag: "2026.10.27-ef7bae9dd"
    pullPolicy: IfNotPresent
  port: 8080
  # The language every search runs in; the tools take none (their schemas
  # are tavily's). SearXNG's own default, auto, follows the client's
  # Accept-Language, and the MCP server sends none, so it fell back to all:
  # Bing then gets no market at all and picks one itself, which from a
  # datacenter IP was Chinese for queries such as "inxm". en gives every
  # engine a market (Bing en-us, DuckDuckGo us-en, Brave us).
  defaultLanguage: en
  # Google proper answers "access denied" from datacenter and residential
  # IPs alike, so it stays off; these are the engines that answer.
  engines:
    - brave
    - duckduckgo
    - bing
    - bing news
    - google news
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Stage two of `extract` (and of the crawlers): headless Chromium for pages
# plain HTTP cannot read. A small install can run HTTP-only with
# enabled: false.
render:
  enabled: true
  # Most browsers rendering at once; the pod's resources grow with it.
  poolSize: 2
  timeoutSeconds: 20
  # Added to `resources` per browser in the pool when render is enabled.
  perBrowser:
    cpuMillicores:
      requests: 100
      limits: 500
    memoryMi:
      requests: 256
      limits: 512


persistence:
  enabled: true
  # Storage class names, left empty so `helm lint`/`helm template` render
  # against the cluster default without failing; the playbook sets both from
  # per-cluster inventory at deploy time. `file` (RWX-capable, e.g. EFS) backs
  # this repo's /data PVC. `block` has no consumer in the base template — it
  # mirrors the fleet-wide playbook contract so repos that add a block-storage
  # resource later (e.g. a database PVC, see mcp-memory-server) need no
  # playbook changes.
  file: ""
  block: ""
  accessMode: ReadWriteMany
  size: 50Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podAnnotations: {}

# Fleet-standard default footprint. Override per repo from measured usage
# (kubectl top): raise limits if the server OOMs or throttles; keep requests
# close to real idle/steady usage — they reserve node capacity fleet-wide.
# This is the footprint without browsers: with render enabled the pod gets
# render.perBrowser × render.poolSize on top. Write CPU in m or cores and
# memory in Mi or Gi; the chart adds to these numbers.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

nodeSelector: {}

tolerations: []

affinity: {}
