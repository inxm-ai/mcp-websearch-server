apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.appName }}
  namespace: orchestrator
  labels:
    app: {{ .Values.appName }}
  annotations:
    description: {{ .Values.description | quote }}
    basePath: {{ .Values.env.MCP_BASE_PATH | quote }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    app: {{ .Values.appName }}