{{- if .Values.searxng.enabled }}
{{- $name := printf "%s-searxng" .Values.appName }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
type: Opaque
data:
  # SearXNG refuses to start with its default secret. Generated once and kept
  # across upgrades so the pod does not restart on every deploy.
  {{- if and $existing $existing.data }}
  secret: {{ index $existing.data "secret" }}
  {{- else }}
  secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
