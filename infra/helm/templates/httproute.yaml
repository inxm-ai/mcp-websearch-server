{{- if not (has .Values.networking.mode (list "ingress" "gateway")) }}
{{- fail "networking.mode must be either ingress or gateway" }}
{{- end }}
{{- if eq .Values.networking.mode "gateway" }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.appName }}
  namespace: orchestrator
  labels:
    app: {{ .Values.appName }}
spec:
  parentRefs:
    {{- toYaml .Values.networking.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ required "networking.gateway.hostname is required when networking.mode is gateway" .Values.networking.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.env.MCP_BASE_PATH | quote }}
      filters:
{{ include "mcp-websearch-server-chart.externalAuthFilter" . | nindent 8 }}
      backendRefs:
        - name: {{ .Values.appName }}
          port: {{ .Values.service.port }}
{{- end }}
