apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: {{ .Values.appName }}-data
          persistentVolumeClaim:
            claimName: {{ .Values.appName }}-data
      {{- end }}
      containers:
        - name: {{ .Values.appName }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- include "mcp-websearch-server-chart.resources" . | trim | nindent 12 }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: SEARXNG_URL
              value: {{ include "mcp-websearch-server-chart.searxngUrl" . | quote }}
            - name: RENDER_ENABLED
              value: {{ .Values.render.enabled | quote }}
            - name: RENDER_POOL_SIZE
              value: {{ .Values.render.poolSize | quote }}
            - name: RENDER_TIMEOUT_SECS
              value: {{ .Values.render.timeoutSeconds | quote }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: {{ .Values.appName }}-data
              mountPath: /data
          {{- end }}