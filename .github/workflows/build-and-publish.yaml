name: Build and publish

# Runs this repo's checks (ci.yaml and harness.yaml), builds the
# mcp-websearch-server image once and packages its chart, then publishes both
# to GHCR with this run's GITHUB_TOKEN:
#
#   image  ghcr.io/inxm-ai/mcp-websearch-server, tagged like
#          enterprise-mcp-bridge: latest and sha-<short sha> on main, <tag> on
#          a tag push. Copied from the build's archive with its digest kept.
#   chart  oci://ghcr.io/inxm-ai/charts/mcp-websearch-server at its Chart.yaml
#          version, from main only.
#
# ACR and ECR, which lz-infra's deploy reads, get their copies from
# infrastructure-owned workflows, as enterprise-mcp-bridge's do: lz-azure and
# lz-aws "002-4 Sync mcp-websearch-server" copy the image (same digest) and
# the chart from GHCR. This repo is public, so it can neither call their
# internal reusable workflows (push-to-acr.yml, push-to-ecr.yml) nor read org
# secrets such as GH_DEPLOY_TOKEN; it publishes with GITHUB_TOKEN only and
# deploys nothing.
#
# Pull requests run ci.yaml and harness.yaml on their own.

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mcp-websearch-server

jobs:
  # Publish only a commit that passed this repo's checks.
  ci:
    uses: ./.github/workflows/ci.yaml

  harness:
    uses: ./.github/workflows/harness.yaml

  build:
    name: Build image and package chart
    needs: [ci, harness]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ghcr-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      # enterprise-mcp-bridge's tags; the labels link the GHCR package to
      # this repo.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}
            type=ref,event=tag

      - uses: docker/setup-buildx-action@v4

      # One OCI archive holding one image, which every push job copies
      # unchanged. linux/amd64 only: no cluster runs ARM. The image ci.yaml
      # checked comes from the same Dockerfile and build cache.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=dist/image/${{ env.IMAGE_NAME }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same Helm as push-to-acr.yml and push-to-ecr.yml; Marketplace
      # installs use Helm 3.
      - uses: azure/setup-helm@v5
        with:
          version: v3.14.4

      - name: Package chart
        run: helm package infra/helm --destination dist/chart

      # push-ghcr downloads them by these names.
      - name: Upload chart
        uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/chart/*.tgz
          if-no-files-found: error

      - name: Upload image
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: dist/image/*.tar
          if-no-files-found: error

  push-ghcr:
    name: Push to GHCR
    needs: build
    # A run on another branch gets no tags, so there is nothing to push.
    if: ${{ needs.build.outputs.ghcr-tags != '' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v8
        with:
          name: image
          path: image

      # skopeo copies the archive's manifests and blobs as they are (every
      # platform, attestations included); --preserve-digests fails rather
      # than convert. A docker load/push round trip can change the digest.
      - name: Push image
        env:
          TAGS: ${{ needs.build.outputs.ghcr-tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(image/*.tar)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "::error::Expected one OCI archive in artifact 'image', found ${#archives[@]}."
            exit 1
          fi
          archive="${archives[0]}"
          digest="$(tar -xOf "${archive}" index.json | jq -r '.manifests[0].digest')"
          command -v skopeo >/dev/null || sudo apt-get install --yes --no-install-recommends skopeo
          skopeo login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
          {
            echo "### Image pushed to GHCR"
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"
          while IFS= read -r target; do
            [[ -n "${target}" ]] || continue
            skopeo copy --all --preserve-digests --quiet "oci-archive:${archive}" "docker://${target}"
            pushed="sha256:$(skopeo inspect --raw "docker://${target}" | sha256sum | cut -d' ' -f1)"
            if [[ "${pushed}" != "${digest}" ]]; then
              echo "::error::${target} has digest ${pushed}, but the build produced ${digest}."
              exit 1
            fi
            echo "| \`${target}\` | \`${pushed}\` |" >> "${GITHUB_STEP_SUMMARY}"
          done <<<"${TAGS}"

      - name: Download chart
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/download-artifact@v8
        with:
          name: chart
          path: chart

      - uses: azure/setup-helm@v5
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          version: v3.14.4

      # The sync workflows pull it from here at the version in the
      # Chart.yaml of the commit they copy.
      - name: Push chart
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHART_REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin <<<"${GH_TOKEN}"
          helm push chart/*.tgz "${CHART_REGISTRY}"
