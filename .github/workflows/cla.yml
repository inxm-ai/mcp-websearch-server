name: "CLA Assistant"

# Records CLA signatures in inxm-ai/cla-signatures, as enterprise-mcp-bridge
# does. pull_request_target runs with this repo's secrets on pull requests
# from forks, so this workflow must never check out or run the pull request's
# code: it only reads the PR's commit authors and comments through the API.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: Verify CLA
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes signatures to inxm-ai/cla-signatures; a secret of this repo.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          branch: main
          path-to-signatures: "mcp-websearch-server/signatures/version1/cla.json"
          remote-organization-name: inxm-ai
          remote-repository-name: cla-signatures
          path-to-document: https://github.com/inxm-ai/mcp-websearch-server/blob/main/CONTRIBUTING.md#contributor-license-agreement-cla
          # Exact names only: a pattern such as bot* would exempt any account
          # whose name matches it.
          allowlist: dependabot[bot]
