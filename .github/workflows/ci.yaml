name: CI

# Repo-owned build and deployment conformance. The deterministic Rust
# sensors (fmt, clippy, the typed-tool-returns fitness function, test) live
# in the renderer-managed harness.yaml — never duplicate one here.
#
# The image build below is a distinct gate, not a duplicate of harness.yaml:
# the Dockerfile cross-compiles a musl binary with its own toolchain and
# target (see Dockerfile), which harness.yaml's host-glibc `cargo build`
# does not exercise. It then checks that the image starts the way the chart
# runs it (scripts/test-image-starts.sh: libraries, init containers, at least
# one tool listed), then runs the fleet smoke engine on it
# (infra/run-image-smoke.sh: the exact tool list from infra/expected-tools.txt,
# and real HTTP-stage calls through infra/smoke-tool.sh), and finally renders
# a JavaScript page with Chromium's sandbox on under the chart's security
# settings (scripts/test-render-sandbox.sh), which the fleet smoke's plain
# `docker run` cannot do.

on:
  pull_request:
  push:
    branches: [main]
  # build-and-publish.yaml calls this before it publishes.
  workflow_call:

jobs:
  chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint infra/helm
      - run: helm template mcp-websearch-server infra/helm >/dev/null

  # The publish wiring: workflow syntax, then what build-and-publish.yaml
  # and the playbook must keep (scripts/test-publish-workflow.sh).
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - run: bash scripts/test-publish-workflow.sh

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: mcp-websearch-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: bash scripts/test-image-starts.sh mcp-websearch-server:ci
      - run: bash infra/run-image-smoke.sh mcp-websearch-server:ci
      - run: bash scripts/test-render-sandbox.sh mcp-websearch-server:ci
