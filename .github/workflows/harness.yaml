name: Harness

# The deterministic sensors, one step each — the same set `make harness` runs
# locally. Build, chart and deployment checks belong to the repo-owned
# ci.yaml; a sensor must never run in both files.

on:
  pull_request:
  push:
    branches: [main]
  # trigger-deployment.yaml calls this before it deploys.
  workflow_call:

jobs:
  sensors:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features
      - uses: taiki-e/install-action@c114f6e1756596f56b6d3c93a9c0bbd6b5ec1154 # cargo-llvm-cov
      # Coverage is a reported signal, never a gate — no thresholds anywhere.
      - run: cargo llvm-cov --workspace --all-features --summary-only
