name: Deploy to Tailscale

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The deploy is sent with GH_DEPLOY_TOKEN; GITHUB_TOKEN only needs to read the repo.
permissions:
  contents: read

jobs:
  # Deploy only a commit that passed this repo's checks.
  ci:
    uses: ./.github/workflows/ci.yaml

  harness:
    uses: ./.github/workflows/harness.yaml

  trigger_other_repo:
    needs: [ci, harness]
    runs-on: ubuntu-latest
    steps:
      - name: Send Repository Dispatch Event
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GH_DEPLOY_TOKEN }}
          repository: inxm-ai/lz-aws
          event-type: request-deploy
          client-payload: '{"project": "mcp-websearch-server", "tenant": "qa"}'
